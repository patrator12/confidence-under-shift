<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Confidence Under Shift</title>
  <desc id="d">Banner showing the project title and a sketch of a reliability diagram where confidence drifts away from the honest diagonal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>

  <!-- Title block -->
  <text x="60" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#ffffff">Confidence Under Shift</text>
  <rect x="60" y="136" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#c7d2fe">Predict and repair model overconfidence on real-world data</text>

  <!-- Chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#e0e7ff">
    <rect x="60" y="222" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#a5b4fc" stroke-opacity="0.5"/>
    <text x="125" y="245" text-anchor="middle">Calibration</text>
    <rect x="205" y="222" width="185" height="36" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#a5b4fc" stroke-opacity="0.5"/>
    <text x="297.5" y="245" text-anchor="middle">Distribution Shift</text>
    <rect x="405" y="222" width="240" height="36" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#a5b4fc" stroke-opacity="0.5"/>
    <text x="525" y="245" text-anchor="middle">Label-Free Warning Score</text>
  </g>

  <!-- Mini reliability sketch -->
  <g>
    <rect x="800" y="40" width="340" height="240" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#a5b4fc" stroke-opacity="0.35"/>
    <line x1="830" y1="255" x2="1120" y2="255" stroke="#c7d2fe" stroke-opacity="0.6" stroke-width="1.5"/>
    <line x1="830" y1="255" x2="830" y2="65" stroke="#c7d2fe" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- gap area between honest diagonal and overconfident curve -->
    <path d="M830,255 L1120,65 L1120,150 C1040,222 950,250 830,255 Z" fill="#f87171" fill-opacity="0.28"/>
    <!-- honest diagonal -->
    <line x1="830" y1="255" x2="1120" y2="65" stroke="#e0e7ff" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- overconfident curve -->
    <path d="M830,255 C950,250 1040,222 1120,150" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e0e7ff">
      <text x="975" y="274" text-anchor="middle">confidence</text>
      <text x="905" y="120" fill="#e0e7ff">honest (dashed)</text>
      <text x="1000" y="240" fill="#fecaca">overconfident gap</text>
    </g>
  </g>
</svg>
