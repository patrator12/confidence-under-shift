<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Concept sketch: calibration before and after distribution shift</title>
  <desc id="d">A reliability diagram sketch. The honest diagonal is dashed. A blue curve near the diagonal shows a model on its home domain. A red curve well below the diagonal shows the same model on a new domain, where its confidence is higher than its accuracy.</desc>

  <rect x="1" y="1" width="898" height="518" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328">What "miscalibration under shift" looks like</text>

  <!-- gap area -->
  <path d="M110,410 L510,70 L510,200 C380,330 230,400 110,410 Z" fill="#ef4444" fill-opacity="0.14"/>

  <!-- axes -->
  <line x1="110" y1="410" x2="530" y2="410" stroke="#57606a" stroke-width="2"/>
  <line x1="110" y1="410" x2="110" y2="60" stroke="#57606a" stroke-width="2"/>

  <!-- ticks -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#57606a" text-anchor="middle">
    <line x1="110" y1="410" x2="110" y2="418" stroke="#57606a"/>
    <text x="110" y="436">0</text>
    <line x1="310" y1="410" x2="310" y2="418" stroke="#57606a"/>
    <text x="310" y="436">0.5</text>
    <line x1="510" y1="410" x2="510" y2="418" stroke="#57606a"/>
    <text x="510" y="436">1.0</text>
    <line x1="102" y1="410" x2="110" y2="410" stroke="#57606a"/>
    <text x="94" y="415" text-anchor="end">0</text>
    <line x1="102" y1="240" x2="110" y2="240" stroke="#57606a"/>
    <text x="94" y="245" text-anchor="end">0.5</text>
    <line x1="102" y1="70" x2="110" y2="70" stroke="#57606a"/>
    <text x="94" y="75" text-anchor="end">1.0</text>
  </g>

  <!-- axis labels -->
  <text x="310" y="466" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Model confidence</text>
  <text transform="translate(44 240) rotate(-90)" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Actual accuracy</text>

  <!-- honest diagonal -->
  <line x1="110" y1="410" x2="510" y2="70" stroke="#57606a" stroke-width="2.5" stroke-dasharray="8 7"/>

  <!-- in-domain curve -->
  <path d="M110,410 C230,335 380,190 510,80" fill="none" stroke="#0969da" stroke-width="4.5" stroke-linecap="round"/>

  <!-- shifted curve -->
  <path d="M110,410 C230,400 380,330 510,200" fill="none" stroke="#cf222e" stroke-width="4.5" stroke-linecap="round"/>

  <!-- annotation -->
  <circle cx="450" cy="254" r="6" fill="#cf222e"/>
  <line x1="450" y1="262" x2="450" y2="360" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="505" y="378" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#cf222e">Says "very sure" but is</text>
  <text x="505" y="396" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#cf222e">right far less often</text>

  <!-- legend -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">
    <line x1="580" y1="120" x2="625" y2="120" stroke="#57606a" stroke-width="2.5" stroke-dasharray="8 7"/>
    <text x="638" y="119" font-weight="600">Perfectly calibrated</text>
    <text x="638" y="139" fill="#57606a">confidence matches accuracy</text>

    <line x1="580" y1="190" x2="625" y2="190" stroke="#0969da" stroke-width="4.5" stroke-linecap="round"/>
    <text x="638" y="189" font-weight="600">Home domain</text>
    <text x="638" y="209" fill="#57606a">e.g. Hospital A: close to honest</text>

    <line x1="580" y1="260" x2="625" y2="260" stroke="#cf222e" stroke-width="4.5" stroke-linecap="round"/>
    <text x="638" y="259" font-weight="600">New domain</text>
    <text x="638" y="279" fill="#57606a">e.g. Hospital B: overconfident</text>

    <rect x="580" y="322" width="45" height="22" fill="#ef4444" fill-opacity="0.22"/>
    <text x="638" y="333" font-weight="600">The gap</text>
    <text x="638" y="353" fill="#57606a">ECE measures its size</text>
  </g>

  <text x="450" y="500" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#57606a">Illustrative sketch of the concept. These are not experimental results.</text>
</svg>
